name: Render Short Video

on:
  push:
    branches:
      - 'render-*'
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Mã video cần render (ví dụ: bhca_v1)'
        required: true
        default: 'bhca_v1'
      scale:
        description: 'Độ phân giải (1 = 1080x1920 Full HD, 0.333 = 360p Draft)'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  render:
    name: 🎬 Render Video
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Xác định video_id
        id: parse_id
        run: |
          if [ -n "${{ github.event.inputs.video_id }}" ]; then
            VID="${{ github.event.inputs.video_id }}"
          else
            BRANCH="${GITHUB_REF_NAME}"
            VID="${BRANCH#render-}"
          fi
          echo "video_id=$VID" >> $GITHUB_OUTPUT
          echo "Render Video ID: $VID"

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: remotion-video/package-lock.json

      - name: 📦 Cài đặt thư viện hệ thống cho Chromium & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2 fonts-noto-cjk

      - name: 📦 Cài đặt Dependencies Remotion
        working-directory: remotion-video
        run: npm ci

      - name: 🎥 Render Remotion Video (Full HD)
        working-directory: remotion-video
        run: |
          VID="${{ steps.parse_id.outputs.video_id }}"
          mkdir -p output/$VID
          
          PROPS_FILE="./public/video_data_${VID}.json"
          if [ ! -f "$PROPS_FILE" ]; then
            echo "❌ Không tìm thấy file dữ liệu: $PROPS_FILE"
            exit 1
          fi

          SCALE_OPT=""
          SCALE_VAL="${{ github.event.inputs.scale }}"
          if [ -n "$SCALE_VAL" ] && [ "$SCALE_VAL" != "1" ]; then
            SCALE_OPT="--scale=$SCALE_VAL"
          fi

          OUT_FILE="output/$VID/video_${VID}.mp4"
          echo "🚀 Đang render video: $OUT_FILE"
          npx remotion render TiktokShort "$OUT_FILE" --props="$PROPS_FILE" $SCALE_OPT

      - name: 📤 Lưu Video vào GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.parse_id.outputs.video_id }}
          path: remotion-video/output/${{ steps.parse_id.outputs.video_id }}/*.mp4
          retention-days: 7

      - name: 🚀 Tạo GitHub Release để Local tải về
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/render-')
        with:
          tag_name: release-${{ steps.parse_id.outputs.video_id }}
          name: Video Thành Phẩm ${{ steps.parse_id.outputs.video_id }}
          files: remotion-video/output/${{ steps.parse_id.outputs.video_id }}/*.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
